name: Probe Update Time

# J-Quants が「その日のデータ」を何時に出すかを実測する。
#
# 取り込み（Update Data Store）を平日21:30 JST に置いているが、その時刻に
# 根拠が無い。もっと早く出ているなら前倒しできる。公式ドキュメントは
# この実行環境から読めないので、叩いて測る。
#
# 1回の実行の中でポーリングするので、Actions のスケジュール遅延に
# 影響されない。遅れるのは開始時刻だけで、観測時刻は実測のまま残る。
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'この時刻(JST)まで待ってから見始める。例 15:00'
        required: false
        default: '15:00'
      until:
        description: 'この時刻(JST)まで待つ。例 21:00'
        required: false
        default: '21:00'
      interval:
        description: 'ポーリング間隔（秒）'
        required: false
        default: '300'
      date:
        description: '対象日 (YYYY-MM-DD, JST)。既定は今日'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: probe-update-time
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # GitHub の上限は360分。ポーリングで使い切る前提なので目一杯に取る
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          python3 research/probe_update_time.py \
            ${{ inputs.start && format('--start {0}', inputs.start) || '' }} \
            --until "${{ inputs.until }}" \
            --interval "${{ inputs.interval }}" \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            --log "$RUNNER_TEMP/observations.csv" 2>&1 | tee probe.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## J-Quants の当日データが出た時刻（実測）'
            echo
            echo '```'
            sed -n '/=== 最初に行が返った時刻/,$p' probe.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-update-time
          path: probe.log
          retention-days: 14
