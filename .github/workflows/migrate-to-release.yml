name: Migrate Artifacts To Release

# 実行中/完了済みの取得ジョブが artifact として出した生データを、
# 永続保存先である GitHub Release (タグ data-raw) に移す。
#
# 差分取得の仕組みを入れる前に走らせた取得の結果を捨てずに済ませるための一度きりの移行。
# 移行後は update-data.yml が差分だけを取り込む。
on:
  # workflow_dispatch はデフォルトブランチに定義が無いと API から呼べないため、
  # 設定ファイルの変更でも起動できるようにしておく
  push:
    branches: ['claude/breakout-model']
    paths: ['research/migrate_run_id.txt']
  workflow_dispatch:
    inputs:
      run_id:
        description: '生データ artifact を持つワークフロー実行のID'
        required: true
      fetch_master:
        description: '銘柄マスタも取得して同梱する'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: data-raw

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Resolve run id
        id: rid
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(tr -d '[:space:]' < research/migrate_run_id.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: research/_incoming
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ls -lh research/_incoming

      - name: Convert to year-partitioned store
        run: python3 research/migrate_artifacts.py 2>&1 | tee migrate.log

      - name: Fetch company master
        if: ${{ inputs.fetch_master != 'false' }}
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          python3 research/jq_bulk.py \
            --from "$(date -u -d '14 days ago' +%Y-%m-%d)" \
            --to   "$(date -u +%Y-%m-%d)" \
            --what master --out-dir research/_data
          ls -lh research/_data/master*.parquet || true

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "J-Quants 生データ" \
              --notes "J-Quants API V2 から取得した日次株価・財務・信用残・TOPIX・銘柄マスタ。年別 parquet と manifest.json。" \
              --latest=false

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(research/_data/*.parquet research/_data/manifest.json)
          [ ${#files[@]} -eq 0 ] && { echo "ファイルがありません"; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "${#files[@]} ファイルをアップロードしました"

      - name: Summary
        run: |
          {
            echo "## 移行結果"; echo '```'; cat migrate.log; echo '```'
            echo "## Release の内容"; echo '```'; ls -lh research/_data; echo '```'
            echo ""
            echo "保存先: [Release \`$RELEASE_TAG\`](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
