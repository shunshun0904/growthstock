name: Run Experiment
on:
  workflow_dispatch:
    inputs:
      exp:
        required: true
        description: Collect prepared fixed-return aggregate metadata
      args:
        required: false
        default: ''
      snapshot:
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt
      - name: Wait for complete six-model preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41574087195 --exit-status --interval 60
      - uses: actions/download-artifact@v4
        with:
          pattern: fixed-return-*
          merge-multiple: true
          path: collected
          run-id: 41574087195
          github-token: ${{ github.token }}
      - name: Verify all six trained models with production dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,shutil,json,hashlib
          from pathlib import Path
          sys.path.insert(0,'research')
          import model_artifacts as A
          for algo in ['lgbm','xgb','cat','lgbm_k15','xgb_k15','cat_k15']:
              d=A.directory(algo);d.mkdir(parents=True,exist_ok=True)
              p=Path('collected')/(algo+'_meta.json')
              meta=json.loads(p.read_text())
              # lab.frame creates a derived cache; it is not an independent raw input.
              inventory=meta['dataInventory']
              assert hashlib.sha256(json.dumps(inventory,sort_keys=True).encode()).hexdigest()==meta['dataSnapshot']
              raw={k:v for k,v in inventory.items() if k!='lab.parquet' and not k.startswith('dataset') and not k.endswith('_oof.parquet') and k!='oof.parquet'}
              raw_digest=hashlib.sha256(json.dumps(raw,sort_keys=True).encode()).hexdigest()
              if raw_digest!=meta['dataSnapshot']:
                  meta['snapshotIncludingDerivedCache']=meta['dataSnapshot']
              meta['dataInventory']=raw;meta['dataSnapshot']=raw_digest
              p.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
              shutil.copyfile(p,d/'meta.json')
          PY
          python3 research/model_artifacts.py install
          python3 research/verify_fixed_models.py > /tmp/fixed_return_v1_verification.json
          gh release upload data-raw /tmp/fixed_return_v1_verification.json --clobber
      - name: Verify complete model set and publish aggregate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          algos=['lgbm','xgb','cat','lgbm_k15','xgb_k15','cat_k15']
          for algo in algos:
              for kind in ['meta','params']:
                  p=Path('collected')/(algo+'_'+kind+'.json')
                  data=json.loads(p.read_text())
                  if kind=='meta':
                      assert data['labelSpec']['version']=='fixed_return_v1'
                      assert data['tuning']['n_trials']==50
                  dest=p.with_name('fixed_return_v1_'+p.name)
                  p.rename(dest)
                  subprocess.run(['gh','release','upload','data-raw',str(dest),'--clobber'],check=True)
          PY
