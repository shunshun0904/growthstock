name: Run Experiment
on:
  workflow_dispatch:
    inputs:
      exp:
        required: true
        description: Fixed-return production preparation
      args:
        required: false
        default: ''
      snapshot:
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fixed-return-production-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        algo: [lgbm, xgb, cat, lgbm_k15, xgb_k15, cat_k15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt
      - name: Download current raw data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/gh_release_download.sh data-raw research/_data
          bash scripts/gh_release_download.sh data-jsf research/_data 'jsf_*'
      - name: Build fixed-return mart
        run: python3 research/build_dataset.py > build.log 2>&1
      - name: Tune fifty trials and fit production OOF and weights
        env:
          ALGO: ${{ matrix.algo }}
          OMP_NUM_THREADS: '4'
        run: python3 research/exp/prepare_fixed_production.py "$ALGO" 2>&1 | tee train.log
      - name: Stage versioned models without changing active production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALGO: ${{ matrix.algo }}
        run: |
          python3 - <<'PY'
          import os,sys,shutil,subprocess
          from pathlib import Path
          sys.path.insert(0,'research')
          import model_artifacts as A
          algo=os.environ['ALGO'];d=A.directory(algo)
          for kind in ['model','oof']:
              p=Path('/tmp')/A.filename(algo,kind)
              shutil.copyfile(d/A.local_name(algo,kind),p)
              subprocess.run(['bash','scripts/gh_release_upload.sh','data-raw',str(p)],check=True)
          out=Path('aggregate-metadata');out.mkdir()
          shutil.copyfile(d/'meta.json',out/(algo+'_meta.json'))
          p=Path('research/lgbm_params.json' if algo=='lgbm' else 'research/multi_params.json')
          shutil.copyfile(p,out/(algo+'_params.json'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-return-${{ matrix.algo }}
          path: aggregate-metadata/*.json
      - name: Summarize
        if: always()
        run: |
          tail -20 build.log 2>/dev/null || true
          tail -30 train.log 2>/dev/null || true
