name: Run Experiment
on:
  workflow_dispatch:
    inputs:
      exp:
        required: true
        description: Collect prepared fixed-return aggregate metadata
      args:
        required: false
        default: ''
      snapshot:
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fixed-return-*
          merge-multiple: true
          path: collected
          run-id: 41574087195
          github-token: ${{ github.token }}
      - name: Verify complete model set and publish aggregate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          algos=['lgbm','xgb','cat','lgbm_k15','xgb_k15','cat_k15']
          for algo in algos:
              for kind in ['meta','params']:
                  p=Path('collected')/(algo+'_'+kind+'.json')
                  data=json.loads(p.read_text())
                  if kind=='meta':
                      assert data['labelSpec']['version']=='fixed_return_v1'
                      assert data['tuning']['n_trials']==50
                  dest=p.with_name('fixed_return_v1_'+p.name)
                  p.rename(dest)
                  subprocess.run(['gh','release','upload','data-raw',str(dest),'--clobber'],check=True)
          PY
