name: Exit Timing

# 出口（いつ売るか）と候補の選び方の比較。入口は翌営業日の寄りに固定する。
# 設計は docs/ENTRY_TIMING_DESIGN.md、出力は docs/EXIT_TIMING.md。
#
# 生データは取りに行かない。Release（タグ data-raw）に置いてあるものを読む。
# 全期間の取得は2.5時間かかるので、評価のたびに叩き直す理由が無い。
on:
  workflow_dispatch:
    inputs:
      test_start:
        description: '期間別に分けるときの境目'
        default: '2024-10-01'
  # workflow_dispatch はデフォルトブランチにファイルが無いと呼べないため、
  # 調査用ブランチでは push でも起動できるようにしておく（probe.yml と同じ理由）。
  push:
    branches: ['claude/charming-ride-vq8hz4']
    paths:
      - 'research/exit_timing.py'
      - 'research/exit_timing_eval.py'
      - '.github/workflows/exit-timing.yml'

permissions:
  contents: write

concurrency:
  group: exit-timing
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      # 要るのは日次バーと TOPIX だけ。財務も信用残も使わないので、
      # Release の全アセット（240MB超）を落とす理由が無い。
      # TOPIX は超過リターン（地合いを引いた分）に要る。
      - name: Download daily bars and TOPIX (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          gh release download data-raw --dir research/_data --clobber \
            --pattern 'bars_*.parquet' --pattern 'topix_*.parquet' || true
          if ! ls research/_data/bars_*.parquet >/dev/null 2>&1; then
            echo "bars_*.parquet が取れなかったので、全アセットを落とす"
            gh release download data-raw --dir research/_data --clobber
          fi
          ls -lh research/_data

      # スコアがあれば「上位だけ買う」形でも測れる。無くても全件で回る。
      - name: Download out-of-fold scores (release, optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/model
          if gh release download data-raw --dir research/model --clobber \
               --pattern 'oof.parquet' 2>/dev/null; then
            echo "out-of-fold スコアを使う"
          else
            echo "out-of-fold スコアが無いので全件のみで評価する"
          fi

      - name: Evaluate
        run: |
          python3 research/exit_timing_eval.py \
            --test-start "${{ inputs.test_start || '2024-10-01' }}" 2>&1 | tee eval.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            tail -40 eval.log 2>/dev/null || echo "ログなし"
            echo '```'
            echo
            cat docs/EXIT_TIMING.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-timing
          path: |
            docs/EXIT_TIMING.md
            research/exit_timing.json
            eval.log
          if-no-files-found: warn

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/EXIT_TIMING.md
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(research): 出口と候補の選び方の比較結果を更新"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1
