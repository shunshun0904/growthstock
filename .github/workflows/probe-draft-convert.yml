name: Probe Draft Convert

# 公開の Release data-raw を下書き（非公開）に移す前の確かめ（2026-11-27。運用者の選択「非公開にする案を作る」）。
#
# J-Quants の個人の利用はデータの第三者への配信が禁止（docs/MINUTE_BARS.md「置き場」）なのに、data-raw（日足・財務など）は
# 公開の Release で誰でも落とせる。移す前に次の2つを確かめる。data-raw そのものには触らない。
#   1. 読むだけの鍵（contents: read）の job から、下書きの Release（今ある data-minute）が見え、取り出しの台本で取れるか
#      （保有の推移・Pages のデプロイ・Check Data Store など、読むだけの鍵で data-raw を読むワークフローが6本ある）
#   2. 公開した Release を下書きに戻せるか。確かめ用の公開の Release（中身は乱数の 2KB）を作り、下書きに戻し、
#      鍵なしで見えなくなるか・鍵ありで中身が同じかを見て、必ず消す
# 確かめた結果は job の要約に PASS / FAIL で出す（分からないことを確かめる回なので、FAIL でも job は止めない）。
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read a draft release with a read-only token
        run: |
          set -u
          ok=(); ng=()
          check() { if [ "$2" = "$3" ]; then ok+=("$1"); echo "PASS $1（$2）"; else ng+=("$1"); echo "FAIL $1（期待 $3 / 実際 $2）"; fi; }
          gh --version | head -1
          v=$(gh release view data-minute --json isDraft --jq .isDraft 2>&1 | head -c 120)
          check "読むだけの鍵: 下書き data-minute をタグ名で見つける" "$v" "true"
          n=$(gh release view data-minute --json assets --jq '[.assets[] | select(.state == "uploaded")] | length' 2>/dev/null || echo error)
          if [ "$n" != "error" ] && [ "$n" -gt 0 ] 2>/dev/null; then r=ok; else r="$n"; fi
          check "読むだけの鍵: アセットの一覧が引ける" "$r" "ok"
          mkdir -p probe_out
          if GH_DOWNLOAD_TRIES=2 GH_DOWNLOAD_WAIT=2 bash scripts/gh_release_download.sh data-minute probe_out 'minute_manifest.json' >/dev/null 2>&1 \
             && [ -s probe_out/minute_manifest.json ]; then r=ok; else r=ng; fi
          check "読むだけの鍵: 取り出しの台本で1ファイル取れる" "$r" "ok"
          rm -rf probe_out
          echo ""
          echo "PASS ${#ok[@]} / FAIL ${#ng[@]}"
          { echo "## 読むだけの鍵（contents: read）で下書きの Release を読めるか"; echo "";
            for x in "${ok[@]}"; do echo "- PASS $x"; done; for x in "${ng[@]}"; do echo "- **FAIL** $x"; done; } >> "$GITHUB_STEP_SUMMARY"

  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: probe-pub-${{ github.run_id }}
    steps:
      - name: Publish, then convert to draft
        run: |
          set -u
          ok=(); ng=()
          check() { if [ "$2" = "$3" ]; then ok+=("$1"); echo "PASS $1（$2）"; else ng+=("$1"); echo "FAIL $1（期待 $3 / 実際 $2）"; fi; }
          code() { curl -s -o /dev/null -w '%{http_code}' -L "$@"; }
          head -c 2000 /dev/urandom > probe.bin
          want=$(sha256sum probe.bin | cut -d' ' -f1)
          gh release create "$TAG" probe.bin --title "公開→下書きの確かめ（すぐ消す）" \
            --notes "Probe Draft Convert が作って消す（中身は乱数）" >/dev/null
          rid=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          aid=$(gh api "repos/$GH_REPO/releases/$rid/assets" --jq '.[0].id')
          dl=$(gh api "repos/$GH_REPO/releases/$rid/assets" --jq '.[0].browser_download_url')
          html=$(gh api "repos/$GH_REPO/releases/$rid" --jq '.html_url')
          check "公開のうちは鍵なしでダウンロードの URL から取れる" "$(code "$dl")" "200"
          if gh release edit "$TAG" --draft=true >/dev/null 2>&1; then r=ok; else r=ng; fi
          check "公開した Release を下書きに戻せる（gh release edit --draft=true）" "$r" "ok"
          check "戻した後: 下書きになっている" "$(gh api "repos/$GH_REPO/releases/$rid" --jq .draft)" "true"
          check "戻した後: 鍵なしで Release（API）を取れない" "$(code "https://api.github.com/repos/$GH_REPO/releases/$rid")" "404"
          check "戻した後: 鍵なしでアセット（API）を取れない" \
            "$(code -H 'Accept: application/octet-stream' "https://api.github.com/repos/$GH_REPO/releases/assets/$aid")" "404"
          check "戻した後: 鍵なしで前のダウンロードの URL から取れない" "$(code "$dl")" "404"
          check "戻した後: 鍵なしで前の Release のページを開けない" "$(code "$html")" "404"
          check "戻した後: 鍵ありでタグ名で見つかる" "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1 | head -c 80)" "true"
          mkdir -p probe_out
          gh release download "$TAG" --pattern probe.bin --dir probe_out --clobber >/dev/null 2>&1 || true
          got=$(sha256sum probe_out/probe.bin 2>/dev/null | cut -d' ' -f1)
          check "戻した後: 鍵ありで取り出した中身が同じ" "${got:-none}" "$want"
          echo ""
          echo "PASS ${#ok[@]} / FAIL ${#ng[@]}"
          { echo "## 公開した Release を下書きに戻せるか"; echo ""; echo "gh: $(gh --version | head -1)"; echo "";
            for x in "${ok[@]}"; do echo "- PASS $x"; done; for x in "${ng[@]}"; do echo "- **FAIL** $x"; done; } >> "$GITHUB_STEP_SUMMARY"

      # 何があっても消す（下書きでも公開でも）
      - name: Delete the probe release
        if: always()
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null && echo "確かめの Release $TAG を消した" || echo "（消す Release は無い）"
          left=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name | startswith(\"probe-pub-\"))] | length")
          echo "残った確かめの Release: $left"
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/probe-pub-" --jq 'length')
          echo "残った確かめのタグ: $tags"
          [ "$left" = "0" ] && [ "$tags" = "0" ]
