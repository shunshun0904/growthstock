name: Deploy to GitHub Pages

# ダッシュボードを静的サイトとしてビルドし GitHub Pages に公開する。
# 事前に Settings > Pages > Source を "GitHub Actions" に設定しておくこと。
on:
  push:
    branches: [main, master, 'claude/jquants-browser-app-bwk19a']
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
  workflow_run:
    # データ更新・予測・画面の銘柄データの取り直しが完了したら自動で再デプロイする。
    #
    # push で繋がないのは、GITHUB_TOKEN による push が
    # 他のワークフローを起こさないため（GitHub のループ防止）。
    workflows: ['Fetch J-Quants Data', 'Predict Breakouts', 'Refresh Stock Details', 'Fetch Filings',
                'New Training Samples', 'Backfill KNN', 'Check News Links']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # データ取得ワークフローが失敗したときはデプロイしない
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run（取得・予測・取り直しが終わったとき）は、公開ブランチの先頭を取る。
          # それらは実行の途中でデータのコミット（chore(data): …）を積むので、起動元の
          # github.event.workflow_run.head_sha（走り始めたときのコミット）にはデータが入って
          # いない。以前はそれを取っていたので、予測の結果は次に誰かが push するまで画面に
          # 出なかった（2026-09-23 の run 35902251565 は 876523d を載せ、同じ予測の実行が
          # 積んだ 1f18614 を載せていなかった）
          ref: ${{ github.event_name == 'workflow_run' && 'claude/jquants-browser-app-bwk19a' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # リカレンス・ネットワーク（日次予測が Release に上げた recurrence.tar.gz。research/recurrence_net.py）を
      # dist/data/recurrence/ に置く。全期間で1日あたり約1MB になるのでリポジトリには入れていない（運用者の選択
      # 「Release に置く」、2026-10-19）。中の名前は recurrence/index.json と recurrence/<日付>_<コード>.json だけのはずなので、
      # それ以外が混ざっていたら展開しない。無い・取れなくてもデプロイは止めない（画面のタブが「まだデータがありません」と出す）
      - name: Recurrence networks (release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rn"
          bash scripts/gh_release_download.sh data-raw "$RUNNER_TEMP/rn" 'recurrence.tar.gz'
          a="$RUNNER_TEMP/rn/recurrence.tar.gz"
          if [ ! -f "$a" ]; then
            echo "Release に recurrence.tar.gz が無い（画面のタブはデータ待ちと出す）"; exit 0
          fi
          if tar -tzf "$a" | grep -qvE '^recurrence/(index|[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9A-Za-z]+)\.json$'; then
            echo "::error::recurrence.tar.gz に想定外の名前がある（展開しない）"; exit 1
          fi
          mkdir -p dist/data
          tar -xzf "$a" -C dist/data
          echo "展開した: $(ls dist/data/recurrence | wc -l) ファイル・$(du -sh dist/data/recurrence | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
