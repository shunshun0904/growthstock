name: Update Data Store

# 生データを GitHub Release (タグ data-raw) に保存し、差分だけを取得する。
#
# 全期間の取得は約2.5時間かかるため、毎回取り直すのは現実的でない。
# 保存済みを取り出して「まだ取っていない営業日」だけを取得し、書き戻す。
#   初回        : 約2.5時間
#   日次更新    : 約5秒（1営業日ぶん）
#   定義の再検証: 0秒（取得不要）
on:
  workflow_dispatch:
    inputs:
      from:
        description: '取得開始日 (省略時は 2016-10-01)'
        required: false
        default: '2016-10-01'
      to:
        description: '取得終了日 (省略時は今日)'
        required: false
        default: ''
      reset:
        description: '取り直す種別（スペース区切り。例: fins）。取得する列を増やしたとき用'
        required: false
        default: ''
      forget:
        description: '取得記録だけを消す種別（スペース区切り。例: margin）。公表前に叩いて0件のまま取得済みになった日を取り直す'
        required: false
        default: ''
      forget_from:
        description: 'forget の開始日 (YYYY-MM-DD)。省略すると全期間'
        required: false
        default: ''
      wait:
        description: '当日の四本値・指数・TOPIX が出るまで待ってから取る（Routine の平日 18:40 JST の起動は yes。その時刻には出ているので1回確かめて進む。過去分の取り直しなど、待つ必要が無いときは no）'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'
  # 予約の起動（cron）は 2026-10-05 にやめた。いまは Claude の Routine が平日 18:40 JST に
  # workflow_dispatch（wait=yes）で起動する（docs/OPERATIONS.md「起動のしかた」）。
  # 10/6・10/7 は 16:10 JST に起動していたが、その日の空売り比率（16:30 ごろ）・大量保有報告書
  # （17:31 まで増える）・決算（18:00 ごろ）が予測に間に合わず、後から作り直す学習の行と予測の
  # 行で値が食い違った（docs/DATA_TIMING.md）。10/8 から 18:40 に移した。
  #
  # cron をやめた理由は GitHub 側にある。予約の起動は実測で +4時間01分〜+7時間19分遅れ
  # （2026-09-11〜10-01、docs/OPERATIONS.md）、10/5（月）は 07:05 UTC の予約が 14:33 UTC
  # （23:33 JST）になっても来なかった。時刻を指定して起動すれば、公開時刻は起動の時刻で決まる。
  # workflow_dispatch はデフォルトブランチにファイルが無いと呼べない。
  # 調査用ブランチからは、このファイルを更新して起動する。
  # 1行目に --reset に渡す種別を書く（空なら通常の差分取得）
  push:
    branches: ['claude/breakout-model']
    paths: ['research/refetch_request.txt']

# すべての run を pipefail 付きの bash にする。
#
# 既定の shell は `bash -e` で pipefail が無い。`python3 ... | tee x.log` は
# パイプの最後（tee）の終了コードで判定されるため、**python が落ちても
# ステップは成功**になる。実測（2026-09-22、run 35713049207）で、
# marginalert の parquet 書き出しが ArrowInvalid で落ちたのに job は
# success になり、後続の earndate / investor が走らないまま終わっていた。
defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: update-data-store
  cancel-in-progress: false

env:
  RELEASE_TAG: data-raw

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "J-Quants 生データ" \
              --notes "J-Quants API V2 から取得した日次株価・財務・信用残・TOPIX。年別 parquet と manifest.json。差分取得の状態は manifest.json が持つ。" \
              --latest=false
            echo "リリースを作成しました"
          else
            echo "リリースは既にあります"
          fi

      - name: Download stored data
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          # 初回（Release に何も無い）は取り出しの手順が見分けて進む。一部だけ取れた状態では
          # 止める（2026-10-01、500 で1ファイル欠けたまま「初回」として続いた。run 36882172803）
          bash scripts/gh_release_download.sh "$RELEASE_TAG" research/_data
          ls -lh research/_data || true

      # master は master.parquet として1ファイルで持つ。
      # master_YYYY.parquet は、日付ループの catch-all バグで
      # 信用残のデータが master の名前で書かれてしまったもの。
      # 保存側にも残っているので消す。
      - name: Remove stray master_YYYY files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          stray=(research/_data/master_[0-9]*.parquet)
          if [ ${#stray[@]} -eq 0 ]; then
            echo "不要な master_* はありません"; exit 0
          fi
          for f in "${stray[@]}"; do
            n=$(basename "$f")
            echo "削除: $n"
            rm -f "$f"
            gh release delete-asset "$RELEASE_TAG" "$n" --yes || \
              echo "  (Release 側には無し)"
          done

      # Routine は 18:40 JST に起動するので、ふだんは当日のデータが出ていて待たない
      # （締切 18:00 を過ぎているので、1回確かめて先へ進む）。待つのは大引け後〜18:00 に
      # 手で起動したとき。締切を過ぎても止めずに先へ進む（祝日は
      # そもそも当日データが無い）。大引け（15:30 JST）より前の起動（翌朝の確認の
      # Routine が前日ぶんを起動し直したとき）は、前日のデータはとうに出ているので
      # 待たずに進む（wait_for_data.py 側で判定）。過去日の取り直しは wait=no で起動する。
      # push 起動（refetch_request.txt）は inputs が無いので待たない。
      #
      # 四本値だけでは足りない。実測（2026-09-18）で四本値 16:00 に対して
      # 業種別指数・TOPIX は 16:30 で、これらは merge_asof(backward) で
      # 結合するため、欠けると欠測ではなく**前日の値**が入る。
      # 決算開示（18:00 ごろ）はここでは待たない。18:40 の起動ならふつうは出ている
      # （出ていなければ翌営業日の取り込みで入るが、その日の予測には欠ける）。
      # 締切 18:00 は実測 16:30 に対して1時間半の余裕。観測は1日ぶんしか
      # 無いので、狭くしすぎない。
      - name: Wait for today's data
        if: github.event_name == 'workflow_dispatch' && inputs.wait != 'no'
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          python3 research/wait_for_data.py \
            --feeds bars,indices,topix --deadline 18:00 --interval 300

      # 種別を1つずつ取り、そのつど Release へ書き戻す。
      #
      # 以前は「全種別を取る」->「アップロード」の2段で、途中経過を一切
      # 保存していなかった。取得したものは runner のディスクにあるだけで、
      # timeout-minutes に当たると job ごとキャンセルされ、後続のステップは
      # 走らない。つまり**それまでの取得が全部消える**。
      # 実測（2026-09-22、run 35714524431）で、全期間バックフィルが
      # 273分たっても終わらず、上限330分まで残り57分という状態になった。
      #
      # jq_bulk.py の種別間に依存は無い（days は --what と無関係に毎回
      # /markets/calendar から作り、どの種別も他の種別の出力を読まない）。
      # manifest も種別ごとの項目しか触らないので、1種別ずつ回して差分だけ
      # 上げれば、上限に当たっても失うのは走っていた1種別ぶんだけになる。
      - name: Fetch missing days
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TO="${{ inputs.to }}"
          [ -z "$TO" ] && TO=$(date -u +%Y-%m-%d)
          FROM="${{ inputs.from }}"
          [ -z "$FROM" ] && FROM="2016-10-01"
          RESET=""
          REQ="${{ inputs.reset }}"
          # push 起動のときは inputs が空なので、要求ファイルの1行目を読む
          if [ -z "$REQ" ] && [ -f research/refetch_request.txt ]; then
            REQ=$(grep -v '^#' research/refetch_request.txt | head -1 | tr -d '\r')
          fi
          # 想定外の値を --reset に渡さない。
          #
          # **種別の一覧を YAML に書き写さない。** 以前はここに
          # bars|fins|margin|topix|indices|master と直書きしており、
          # jq_bulk.py に種別を足したときに片方だけ古くなって
          # 「未知の種別: earndate」で落ちた（run 35714197217）。
          # 正本は jq_bulk.py の1か所だけにする。
          KINDS=$(python3 -c "import sys;sys.path.insert(0,'research');sys.path.insert(0,'scripts');import jq_bulk as J;print(' '.join(['bars','fins','margin','topix','indices','master','master_hist']+list(J.DAILY_KINDS)+list(J.BULK_KINDS)))")
          echo "扱える種別: $KINDS"
          for k in $REQ; do
            case " $KINDS " in
              *" $k "*) ;;
              *) echo "未知の種別: $k（扱えるのは $KINDS）"; exit 1 ;;
            esac
          done
          [ -n "$REQ" ] && RESET="--reset $REQ"
          echo "reset 対象: ${REQ:-なし}"
          # --forget は取得記録だけを外す（parquet は消さない）。
          # 公表前に叩いて0件のまま取得済みになった日を取り直すとき用
          FORGET=""
          FGT="${{ inputs.forget }}"
          for k in $FGT; do
            case " $KINDS " in
              *" $k "*) ;;
              *) echo "未知の種別: $k（扱えるのは $KINDS）"; exit 1 ;;
            esac
          done
          if [ -n "$FGT" ]; then
            FORGET="--forget $FGT"
            FF="${{ inputs.forget_from }}"
            [ -n "$FF" ] && FORGET="$FORGET --forget-from $FF"
          fi
          echo "forget 対象: ${FGT:-なし}"

          # 前回の書き戻しから変わったファイルだけを上げる。
          # bars_*.parquet だけで数百MBあるので、毎回まるごと上げない
          MARK="$RUNNER_TEMP/upload_mark"
          : > fetch.log
          touch "$MARK"
          push_back() {
            local changed
            changed=$(find research/_data -maxdepth 1 -newer "$MARK" \
              \( -name '*.parquet' -o -name 'manifest.json' \) -print)
            if [ -z "$changed" ]; then
              echo "  （書き戻すファイルなし）"; return 0
            fi
            # shellcheck disable=SC2086
            bash scripts/gh_release_upload.sh "$RELEASE_TAG" $changed
            echo "  書き戻した: $(echo "$changed" | wc -l)ファイル"
            touch "$MARK"
          }

          # --reset / --forget は記録を消す操作なので、種別ごとの繰り返しに
          # 入れてはいけない（前の周回で取ったものを次の周回で消してしまう）。
          # 先に1回だけ流す。--what master は実測4秒で、毎回最新に
          # 上書きする種別なので副作用が無い
          if [ -n "$RESET$FORGET" ]; then
            echo "::group::reset / forget を適用"
            python3 research/jq_bulk.py --incremental $RESET $FORGET \
              --from "$FROM" --to "$TO" --what master 2>&1 | tee -a fetch.log
            push_back
            echo "::endgroup::"
          fi

          FAILED=""
          for k in $KINDS; do
            echo "::group::$k"
            if python3 research/jq_bulk.py --incremental \
                 --what "$k" --from "$FROM" --to "$TO" 2>&1 | tee -a fetch.log
            then
              push_back
            else
              # 1種別の失敗で残りを止めない。取れたところまでは書き戻す。
              # 記録は付いていないので、次回この種別だけ取り直される
              echo "[warn] $k の取得に失敗しました（残りは続行する）"
              FAILED="$FAILED $k"
              push_back
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "取得に失敗した種別:$FAILED"
            exit 1
          fi

      # 取得ステップが種別ごとに書き戻しているので、ここは取りこぼしの
      # 受け皿。失敗して抜けたときも、取れたところまでは残す
      - name: Upload to release
        # 取り出しが一部だけで止まったときは上げない（欠けた・短いファイルで Release を上書きしない）
        if: always() && steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(research/_data/*.parquet research/_data/manifest.json)
          # 予測時の特徴量の控え（live_features.parquet）は日次予測だけが書く。
          # ここで上げ直すと、取り込みの最中に予測が足した日を古い版で潰しうる
          keep=()
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = "live_features.parquet" ] && continue
            keep+=("$f")
          done
          files=("${keep[@]}")
          if [ ${#files[@]} -eq 0 ]; then
            echo "アップロードするファイルがありません"; exit 1
          fi
          bash scripts/gh_release_upload.sh "$RELEASE_TAG" "${files[@]}"
          echo "${#files[@]} ファイルをアップロードしました"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 差分取得"
            echo '```'
            tail -40 fetch.log
            echo '```'
            echo "## 保存済みファイル"
            echo '```'
            ls -lh research/_data
            echo '```'
            echo ""
            echo "保存先: [Release \`$RELEASE_TAG\`](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
