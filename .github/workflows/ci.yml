name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: スコアリングエンジンの単体テスト
        run: npm test

      - name: データパイプラインの単体テスト
        run: python3 tests/test_fetcher.py

      # research/ 配下は pandas / scikit-learn が要る。
      # ここを回していなかったため、特徴量の列がデータセットから
      # 黙って落ちる不具合を実際の学習実行まで検出できなかった。
      - name: 研究コードの単体テスト
        run: |
          pip install -r research/requirements.txt
          python3 tests/test_dataset.py
          python3 tests/test_model.py
          python3 tests/test_data_store.py
          # TabICLv2 の検証コード（実験17）。torch と Hugging Face の重みが
          # 要らない部分だけを押さえる。入力の作り方・文脈の切り方・
          # 種の平均が壊れると、出てくる数字が黙って別のものになる
          python3 tests/test_tabicl.py
          # 台帳（スプレッドシート）は利用者の手入力と同居する。
          # 列が増えたときに既存セルがずれないことを回帰で押さえる
          python3 tests/test_sheets.py

      - name: ビルド
        run: npm run build

      - name: ブラウザ・スモークテスト
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshot-*.png
          if-no-files-found: ignore
