name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: スコアリングエンジンの単体テスト
        run: npm test

      - name: データパイプラインの単体テスト
        run: python3 tests/test_fetcher.py

      # research/ 配下は pandas / scikit-learn が要る。
      # ここを回していなかったため、特徴量の列がデータセットから
      # 黙って落ちる不具合を実際の学習実行まで検出できなかった。
      # tests/ の**全部**を回す（2026-09-24 から）。
      #
      # それまでは回すファイルをここに1本ずつ書いていて、14本のうち6本しか
      # 回っていなかった（営業日ゲート・特徴量・損切りのテストは CI で一度も
      # 走っていない）。さらに4本はファイルの途中で unittest.main() を呼んで
      # いたため、スクリプトとして実行すると後ろのクラスが黙って飛ばされ、
      # test_model.py は 120本中106本しか走っていなかった。
      # discover はファイル単位で読み込むので、どちらの取りこぼしも起きない。
      # 新しいテストを足しても、ここを書き換える必要は無い。
      - name: 研究コードの単体テスト（tests/ の全部）
        run: |
          pip install -r research/requirements.txt
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: ビルド
        run: npm run build

      - name: ブラウザ・スモークテスト
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshot-*.png
          if-no-files-found: ignore
