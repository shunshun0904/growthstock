name: Predict Breakouts

# その日の新規ブレイクを採点して、ダッシュボードが読む JSON を書く（日次）。
#
# 生データの取り込み（Update Data Store, 平日16:05 JST 起動）が終わってから走らせる。
# 固定時刻で待つのではなく workflow_run で繋ぐ。取得が遅れた日に
# 古いデータで予測してしまうのを防ぐため。
on:
  workflow_run:
    workflows: ['Update Data Store']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: '予測済みの日でも予測し直す（通常は false。記録を上書きする意図があるときだけ）'
        required: false
        type: boolean
        default: false
  # 取り込みの連鎖が起動しなかった日の保険。平日 23:00 JST (= 14:00 UTC)。
  # 予測済みの日しか無ければ何もしない（ゲートが飛ばす）。その時刻に当日の
  # 日足が無ければ赤で止まるので、取り込みの失敗に気づける
  schedule:
    - cron: '0 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: predict-breakouts
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  predict:
    # 取り込みが失敗した後に workflow_run で起動された場合は走らせない
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 公開ブランチ（＝既定ブランチ）に対して回す。
      # 成果物をここに積まないと GitHub Pages の画面が更新されない。
      # 調査は claude/breakout-model で進め、まとまったらこちらへマージする。
      - uses: actions/checkout@v4
        with:
          ref: claude/jquants-browser-app-bwk19a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Download raw data (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          gh release download data-raw --dir research/_data --clobber
          # head -5 は使わない。pipefail の下では head が5行で先に閉じると ls が
          # Broken pipe（終了コード2）で落ち、ダウンロードは済んでいるのにこの段が
          # 失敗扱いになる（2026-09-22〜23 に4回連続: run 35871378011 など）。
          # sed -n '1,5p' は最後まで読むので ls は書き切れる
          ls -lh research/_data | sed -n '1,5p'

      # 休場日に走ってもやることが無い。ここで見分けて、以降を飛ばす。
      #
      # 鮮度チェックは遅れを平日で数える（祝日カレンダーを持ち込まない）
      # ので、連休では「正常な休場」と「取り込み障害」が同じ赤い×になる。
      # 毎回の連休で赤が出ると、本物の障害を見逃す訓練になってしまう。
      #
      # 営業日かどうかは**推測しない**。カレンダーを引いている取り込み側が
      # manifest に書き残した事実を読むだけ。しかも「直近の営業日ぶんの
      # データが揃っている」ことまで確かめてから飛ばすので、取り込みが
      # 壊れていれば休場日でも飛ばさず、次の鮮度チェックで落ちる。
      # 判断できないときは必ず「進む」側へ倒れる（exit 0 固定）。
      # 予測済みの日（public/data/predictions.json の asOf）より新しい日足が
      # 無ければ飛ばす。壁時計の日付では決めない（2026-09-24 03:24 JST に、
      # 日付をまたいだ自動実行が 9/18 を予測し直して記録に混ぜた）。
      # その時刻に揃っているはずの日足が無ければ stale=true（最後に赤にする）
      - name: Trading-day gate
        id: gate
        env:
          FORCE_PREDICT: ${{ inputs.force && 'true' || 'false' }}
        run: python3 research/trading_day_gate.py

      # 取り込みが失敗した日に、黙って昨日と同じ候補を出さないための関門。
      # 日次予測は取得を行わない（Update Data Store が唯一の書き手）ので、
      # 古ければここで止める。
      # モデルは Release（タグ data-raw）に置く。2.7MB のバイナリを毎週
      # コミットすると、差分圧縮が効かず年138MB リポジトリが膨らむため。
      # まだ Release に上がっていない移行期は、git 側の版をそのまま使う。
      - name: Download model (release)
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/model
          if gh release download data-raw --dir research/model --clobber \
               --pattern 'model.txt' --pattern 'oof.parquet' 2>/dev/null; then
            echo "Release のモデルを使う"
          else
            echo "Release にモデルが無いので、リポジトリ内の版を使う"
          fi
          ls -lh research/model

          # 画面に並べる追加モデル。Release ではアセット名が衝突しないよう
          # <algo>_model.joblib の形で上がっているので、research/models.py が
          # 見る research/model/models/<algo>/ の形に並べ直す。
          # meta.json は git 側（週次学習がコミットする）から来る。
          # 片方だけ揃っていない場合は models.load が (None, None) を返し、
          # そのモデルだけ画面から外れる。日次予測は止まらない。
          if gh release download data-raw --dir /tmp/extra --clobber \
               --pattern '*_model.joblib' --pattern '*_oof.parquet' 2>/dev/null; then
            shopt -s nullglob
            for f in /tmp/extra/*_model.joblib; do
              a=$(basename "$f" _model.joblib)
              mkdir -p "research/model/models/$a"
              mv "$f" "research/model/models/$a/model.joblib"
              [ -f "/tmp/extra/${a}_oof.parquet" ] \
                && mv "/tmp/extra/${a}_oof.parquet" "research/model/models/$a/oof.parquet"
            done
            echo "追加モデル: $(ls -d research/model/models/*/ 2>/dev/null | wc -l)個"
            python3 research/model_lineup.py || true
          else
            echo "Release に追加モデルが無い（基準モデルだけで予測する）"
          fi

      - name: Check freshness
        if: steps.gate.outputs.run != 'false'
        run: python3 research/check_freshness.py --max-age 1

      # 予測したい行（今日のブレイク）はラベルがまだ確定していないので、
      # --keep-unlabeled を付けて残す。学習には絶対に使わないデータセット
      - name: Build prediction dataset
        if: steps.gate.outputs.run != 'false'
        run: |
          python3 research/build_dataset.py --keep-unlabeled \
            --out research/_data/dataset_predict.parquet 2>&1 | tail -25

      - name: Score today's candidates
        if: steps.gate.outputs.run != 'false'
        run: python3 research/predict_daily.py 2>&1 | tee predict.log

      # 学習と予測で特徴量の値が一致するか（research/check_train_serve.py）。
      # 過去に予測した日の行を、今日作り直したデータセット（学習に使うのと同じ作り）
      # と比べる。違う列は「学習だけが、予測の時点では手に入らなかった値を見ている」
      # 疑いがある（2026-09-24 に信用残と投資部門別で見つかった種類の誤り）。
      # 画面の更新は止めないが、許容を超えたら赤にして気づけるようにする
      - name: Check train/serve consistency
        id: trainserve
        if: steps.gate.outputs.run != 'false'
        continue-on-error: true
        run: |
          python3 research/check_train_serve.py 2>&1 | tee train_serve.log
          exit "${PIPESTATUS[0]}"

      # 予測に使った特徴量の控えを Release に置く（日付ごとに最初の予測で凍結）
      - name: Save live features (release)
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=research/_data/live_features.parquet
          if [ -f "$f" ]; then
            gh release upload data-raw "$f" --clobber
            echo "控えを上げた: $(du -h "$f" | cut -f1)"
          else
            echo "控えが無い（候補が無かった日）"
          fi

      # その日の上位銘柄を、既存の取得スクリプトに通して stocks.json を作る。
      #
      # これが無いと、予測タブで見つけた銘柄をオクタゴンへ送っても
      # 「過去時点のスナップショットがありません」になり、
      # タイムマシーン（過去比較）が使えない。スナップショットと株価履歴は
      # この取得スクリプトだけが作れる。
      - name: Fetch details for today's picks
        if: steps.gate.outputs.run != 'false'
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          CODES=$(cat research/_data/top_codes.txt 2>/dev/null || true)
          echo "対象: $CODES"
          if [ -z "$CODES" ]; then
            echo "当日の候補が無いので stocks.json はそのまま"; exit 0
          fi
          python3 scripts/jquants_data_fetcher.py --extra-codes $CODES 2>&1 | tail -15

      # 長期の台帳。リポジトリ側は画面用で、predictions.json は毎日上書き、
      # prediction_history.json は上位5件・400日で消えるので、
      # 実績の検証と手売買の記録はスプレッドシートを正本にする。
      #
      # 認証情報が無い間も日次予測そのものは動かす（画面の更新を止めない）。
      # 台帳への追記が失敗しても、後続（予測 JSON のコミット＝画面の更新）は
      # 止めない。実際に列を足す処理の不具合で失敗し、その日の予測が画面に
      # 反映されないところだった。画面が主で台帳が従なので、従の失敗で主を
      # 落とさない。失敗そのものは実行結果に赤で残り、下の Summary にも出る。
      - name: Append to spreadsheet
        if: steps.gate.outputs.run != 'false'
        continue-on-error: true
        id: sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GSHEET_ID" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON / GSHEET_ID が未設定のため飛ばします"
            echo "（設定するとこの日から追記されます。過去分は遡りません）"
            exit 0
          fi
          python3 research/export_sheets.py 2>&1 | tail -10

      - name: Commit predictions
        if: steps.gate.outputs.run != 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/predictions.json public/data/prediction_history.json \
            public/data/stocks.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(data): ブレイク予測を更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          { echo '## ブレイク予測'
            if [ "${{ steps.gate.outputs.run }}" = "false" ]; then
              echo "> **予測を行いませんでした（新しい日足が無い）。**"
              echo "> ${{ steps.gate.outputs.reason }}"
              echo '> 画面は予測済みの日の内容のままです。'
            fi
            if [ "${{ steps.gate.outputs.stale }}" = "true" ]; then
              echo "> ⚠ **揃っているはずの日足がありません。** ${{ steps.gate.outputs.stale_reason }}"
            fi
            if [ "${{ steps.trainserve.outcome }}" = "failure" ]; then
              echo '> ⚠ **学習と予測で特徴量の値が食い違う列があります**（下の train/serve）。'
            fi
            if [ -f train_serve.log ]; then
              echo '### train/serve'; echo '```'; cat train_serve.log; echo '```'
            fi
            if [ "${{ steps.sheets.outcome }}" = "failure" ]; then
              echo '> ⚠ **スプレッドシートへの追記に失敗しました。**'
              echo '> 画面は更新済みですが、台帳にはこの日の行が入っていません。'
            fi
            echo '```'
            if [ -f predict.log ]; then cat predict.log; else echo "(実行せず)"; fi
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 取り込みが当日の日足を持っていないのに、緑で終わらせない。
      # 予測（未予測の日があればそれ）と記録は済ませてから、最後にここで落とす
      - name: Fail if bars are missing
        if: always() && steps.gate.outputs.stale == 'true'
        run: |
          echo "::error::${{ steps.gate.outputs.stale_reason }}"
          exit 1
