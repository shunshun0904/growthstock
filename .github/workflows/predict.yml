name: Predict Breakouts

# その日の新規ブレイクを採点して、ダッシュボードが読む JSON を書く（日次）。
#
# 生データの取り込み（Update Data Store, 平日21:30 JST）が終わってから走らせる。
# 固定時刻で待つのではなく workflow_run で繋ぐ。取得が遅れた日に
# 古いデータで予測してしまうのを防ぐため。
on:
  workflow_run:
    workflows: ['Update Data Store']
    types: [completed]
  workflow_dispatch:
  # 取り込みが失敗した日でも、手前のデータで一応出しておく保険。
  # 平日 23:00 JST (= 14:00 UTC)
  schedule:
    - cron: '0 14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: predict-breakouts
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  predict:
    # 取り込みが失敗した後に workflow_run で起動された場合は走らせない
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 公開ブランチ（＝既定ブランチ）に対して回す。
      # 成果物をここに積まないと GitHub Pages の画面が更新されない。
      # 調査は claude/breakout-model で進め、まとまったらこちらへマージする。
      - uses: actions/checkout@v4
        with:
          ref: claude/jquants-browser-app-bwk19a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Download raw data (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          gh release download data-raw --dir research/_data --clobber
          ls -lh research/_data | head -5

      # 取り込みが失敗した日に、黙って昨日と同じ候補を出さないための関門。
      # 日次予測は取得を行わない（Update Data Store が唯一の書き手）ので、
      # 古ければここで止める。
      # モデルは Release（タグ data-raw）に置く。2.7MB のバイナリを毎週
      # コミットすると、差分圧縮が効かず年138MB リポジトリが膨らむため。
      # まだ Release に上がっていない移行期は、git 側の版をそのまま使う。
      - name: Download model (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/model
          if gh release download data-raw --dir research/model --clobber \
               --pattern 'model.txt' --pattern 'oof.parquet' 2>/dev/null; then
            echo "Release のモデルを使う"
          else
            echo "Release にモデルが無いので、リポジトリ内の版を使う"
          fi
          ls -lh research/model

      - name: Check freshness
        run: python3 research/check_freshness.py --max-age 1

      # 予測したい行（今日のブレイク）はラベルがまだ確定していないので、
      # --keep-unlabeled を付けて残す。学習には絶対に使わないデータセット
      - name: Build prediction dataset
        run: |
          python3 research/build_dataset.py --keep-unlabeled \
            --out research/_data/dataset_predict.parquet 2>&1 | tail -25

      - name: Score today's candidates
        run: python3 research/predict_daily.py 2>&1 | tee predict.log

      # その日の上位銘柄を、既存の取得スクリプトに通して stocks.json を作る。
      #
      # これが無いと、予測タブで見つけた銘柄をオクタゴンへ送っても
      # 「過去時点のスナップショットがありません」になり、
      # タイムマシーン（過去比較）が使えない。スナップショットと株価履歴は
      # この取得スクリプトだけが作れる。
      - name: Fetch details for today's picks
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          CODES=$(cat research/_data/top_codes.txt 2>/dev/null || true)
          echo "対象: $CODES"
          if [ -z "$CODES" ]; then
            echo "当日の候補が無いので stocks.json はそのまま"; exit 0
          fi
          python3 scripts/jquants_data_fetcher.py --extra-codes $CODES 2>&1 | tail -15

      # 長期の台帳。リポジトリ側は画面用で、predictions.json は毎日上書き、
      # prediction_history.json は上位5件・400日で消えるので、
      # 実績の検証と手売買の記録はスプレッドシートを正本にする。
      #
      # 認証情報が無い間も日次予測そのものは動かす（画面の更新を止めない）。
      - name: Append to spreadsheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GSHEET_ID" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON / GSHEET_ID が未設定のため飛ばします"
            echo "（設定するとこの日から追記されます。過去分は遡りません）"
            exit 0
          fi
          python3 research/export_sheets.py 2>&1 | tail -10

      - name: Commit predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/predictions.json public/data/prediction_history.json \
            public/data/stocks.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(data): ブレイク予測を更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          { echo '## ブレイク予測'; echo '```'
            if [ -f predict.log ]; then cat predict.log; else echo "(実行せず)"; fi
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
