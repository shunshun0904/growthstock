name: Retrain Weekly

# 運用に出すモデルを作り直す（週次・日曜の朝）。
#
# 日次の予測はこのワークフローが保存したモデルを読むだけで、学習はしない。
# 毎日学習し直すと、その日の予測が「今日のモデル」に依存して
# 前日と比較できなくなるため。
#
# 週の境目（日曜）に置くのは、月〜金の予測が5日とも同じモデルで
# 採点されるようにするため。週の途中で差し替えると、その日の候補が
# 前日までと比較できなくなる。ここを動かすときはその点に注意する。
#
# 意図的に予測へ繋いでいない。日曜に予測すると金曜引け基準の候補が
# 金曜夜とは別のモデルで二度出ることになり、どちらを見ればよいのか
# 分からなくなる。新しいモデルは月曜夜の予測から効く。
on:
  # 予約の起動（cron）は 2026-10-05 にやめた。Claude の Routine が日曜 09:10 JST に
  # workflow_dispatch（tune=yes）で起動する（docs/OPERATIONS.md「起動のしかた」）。
  # 2026-11-01 から、日曜 09:10 の回は ranking=no（1.2σ の木3本だけ）で、ランキング学習2本（日次・直近5営業日の組）は
  # 日曜 14:10 JST の別の回（tune=yes・only=ltr,ltr5）で作る（運用者の選択 2026-10-30「日曜 14:10 に分ける」。
  # docs/MODEL_ADOPTION_RULES.md §85）。同じ回で順番に回すと、基準モデルの探索・学習が落ちたときにランキング学習も
  # その週は作り直されなかった。土曜 09:10 の回は 1.5σ の木3本（only=lgbm_k15,xgb_k15,cat_k15）
  #
  # GitHub の cron は実測で +4時間01分〜+7時間19分遅れ（docs/OPERATIONS.md）、
  # 日曜 09:05 JST の予約が実際に動くのは 13〜14時台だった。時刻を指定して起動すれば
  # 09:10 に始まり、所要 3〜5時間（探索込み。探索なしなら20分ほど）で昼過ぎに終わる。2026-11-01 からは 09:10 の回（1.2σ の
  # 木3本）が 1.5〜2.5時間、14:10 の回（ランキング学習2本）が 1〜1.5時間の見込み。
  #
  # 朝に置いても学習の前提は変わらない。使うのは金曜引けまでのデータで、
  # 土日に増えるものは無い（鮮度チェックは営業日で数えるので、朝でも夜でも
  # 同じ判定になる）。月〜金の予測が5日とも同じモデルで採点される、という
  # 週の境目の性質も保たれる。
  workflow_dispatch:
    inputs:
      tune:
        description: 'ハイパーパラメータを探索し直す（見込み+30分。no にすると保存済みを使う。基準モデル（1.2σ の LightGBM）は探索したときの木の本数が今と違えば学習しない）'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      only:
        description: '画面に並べる追加モデルのうち、これだけ探索・学習する（例: lgbm_k15,xgb_k15,cat_k15。空なら 1.2σ の木3本とランキング学習（ranking=no なら 1.2σ の木3本だけ）。1.5σ の3本は指定したときだけ。ltr はランキング学習だけ、ltr5 は直近5営業日の組のランキング学習だけ（tune=yes なら木の形も探索し直す）。1.8σ の4本は 2026-10-24 に、ロジスティック回帰（logit・logit_k15）は 2026-11-02 の予測から外した（名指ししても止まる）。指定すると基準モデル（1.2σ の LightGBM）は触らない）'
        required: false
        default: ''
      ranking:
        description: 'ランキング学習（日次 ltr・直近5営業日の組 ltr5）も回すか。日曜 09:10 の回は no（ランキング学習は日曜 14:10 の回が only=ltr,ltr5 で作る。2026-10-30 の運用者の選択「日曜 14:10 に分ける」）。no のときに only へ ltr・ltr5 を書くと止まる'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: retrain-weekly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 探索まで回すと長い。探索なしなら20分ほど。
    #
    # 毎週探索する構成での見積り
    #                                         2026-09-20 実測      2026-09-27 からの見込み
    #                                         （151列・木200本）   （206列・木200本）
    #   前処理（取得・データセット作成）      2分                  2〜3分
    #   基準モデルの探索（3プリセット×50試行）21分                 約27分
    #   基準モデルの学習                      1分                  約2分
    #   追加4モデルの探索（logit が最長）     117分（logit 74分）  約2時間半
    #   追加4モデルの学習                     3分                  約4分
    #   合計                                  2時間23分            約3時間
    #
    # 見込みの根拠は docs/MODEL_ADOPTION_RULES.md §12（206列・木200本の探索は実験48 で
    # 12.4分／1プリセット。追加モデルは列が増えるぶんだけ長くなる）。
    # 木を500本にすると、基準モデルだけでも約3時間35分、追加モデルも500本なら約4時間30分の
    # 見込みで、後者はこのジョブに収まらない。全モデル200本のままにしている
    # （2026-09-25、運用者の判断。tuning.SEARCH_N_ESTIMATORS の注記）。
    #
    # 2026-10-29 から、ランキング学習の木の形の探索（Tune ranking model。50試行 × 5分割）を足した。実験114c の実測で
    # 1回 14〜20分（上限 45分）。10/24 の全モデルの回（2時間27分）に足して約2時間50分の見込み
    # 2026-11-01 の回から、直近5営業日の組のランキング学習の探索と学習（Tune / Train 5-day ranking model）を足した
    # （実験117 の実測で探索 31.6分。2026-10-30 の試しの回で 37.2分。上限 60分）。同じ回からロジスティック回帰（探索 29〜74分）を
    # 外し、ランキング学習2本は日曜 14:10 の別の回（only=ltr,ltr5。試しの回の実測で ltr5 だけなら 55分）に分けた
    #
    # 実際の打ち切りはステップ単位で掛けてあるので、ここは最後の砦
    timeout-minutes: 330
    steps:
      # ジョブの始まりの時刻。ランキング学習の探索（Tune ranking model）は、ジョブの上限までの残りが足りなければ飛ばす
      - name: Start time
        id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      # 公開ブランチ（＝既定ブランチ）に対して回す。
      # 成果物をここに積まないと GitHub Pages の画面が更新されない。
      # 調査は claude/breakout-model で進め、まとまったらこちらへマージする。
      - uses: actions/checkout@v4
        with:
          ref: claude/jquants-browser-app-bwk19a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Download raw data (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          bash scripts/gh_release_download.sh data-raw research/_data
          # Optuna の試行 DB が降りてきたら、前週までの試行を引き継げる
          ls -la research/_data/optuna_multi.db 2>/dev/null \
            && echo "探索の試行 DB あり（引き継ぐ）" \
            || echo "探索の試行 DB なし（ゼロから）"

      # 日曜は Update Data Store（平日 18:40 JST）が走らない。
      # 金曜の取り込みが失敗していると、気づかないまま先週のデータで
      # 学習し直すことになるので、ここで自分で差分を取りに行く。
      # manifest を見て未取得の営業日だけ取るので、揃っていれば数秒で終わる。
      - name: Fetch incremental (J-Quants)
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          python3 research/jq_bulk.py --incremental \
            --from 2016-10-01 --to "$(date -u '+%Y-%m-%d')" 2>&1 | tail -20

      # 取りに行ったうえで古いなら、取得そのものが壊れている。学習しない
      - name: Check freshness
        run: python3 research/check_freshness.py --max-age 2

      - name: Upload refreshed raw data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(research/_data/*.parquet research/_data/manifest.json)
          # 予測時の特徴量の控え（live_features.parquet）は日次予測だけが書く。
          # ここで上げ直すと、学習の最中に予測が足した日を古い版で潰しうる
          keep=()
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = "live_features.parquet" ] && continue
            keep+=("$f")
          done
          files=("${keep[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "アップロードなし"; exit 0; fi
          bash scripts/gh_release_upload.sh data-raw "${files[@]}"

      # 学習用。ラベル未確定の行は入れない（--keep-unlabeled を付けない）
      - name: Build dataset
        run: python3 research/build_dataset.py 2>&1 | tail -20

      # 毎週探索する。精度を優先する判断（基準モデル（1.2σ の LightGBM）は LGBMClassifier なので
      # pointwise のみ。LTR は本番で使っていないので探索しない）。
      #
      # 引き換えに、特徴量も母集団も変えていないのにパラメータが週ごとに動く。
      # 予測が変わったときに「相場が変わった」のか「パラメータが変わった」のかを
      # 切り分けられなくなるので、下の Commit model metadata で lgbm_params.json の
      # 差分を実行要約に出し、何が動いたかを毎週見えるようにしてある。
      #
      # 実測: 3プリセット × 50試行 × 5分割 で21分（2026-09-20。151列・木200本）。
      # 2026-09-27 から本番の列が239列（2026-09-26 の決定）になり、見込みは約30分（先頭の本番の列だけで約13分）。
      # 2026-10-25 から249列（2026-10-17 の決定。抜けた土台の形2列・下げの深さ3列・直近の増減5列。docs/MODEL_ADOPTION_RULES.md §62〜§64）
      # の予定だったが、同じ 10/18 の夕方に360列（249列 + テクニカル指標111列。2026-10-18 の決定。§68）に切り替えた。
      # 360列の探索は実験105 の実測で lgbm 1.3〜1.7倍の時間（探索 574 → 988秒・914 → 1174秒）。データセットを作るステップも
      # 約2分 → 約10分（テクニカル指標の計算）。
      # 探索の記録には探索したときの木の本数（tuning.SEARCH_N_ESTIMATORS）が残り、
      # 基準モデルの学習（train_production.py）は本数が今と違えば止まる。
      # 追加モデルだけ作る回（only）は、基準モデル（1.2σ の LightGBM）の探索も学習も飛ばす。
      # 週の途中で基準モデルを差し替えると、その週の候補が前日までと比較できなくなる
      - name: Resolve scope
        id: scope
        env:
          ONLY: ${{ inputs.only }}
          RANKING: ${{ inputs.ranking }}
        run: |
          # 入力をそのままシェルに展開しない（run-experiment.yml と同じ考え方）。名前の形だけ通す
          if [ -n "$ONLY" ] && ! [[ "$ONLY" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
            echo "only の形が不正: $ONLY"; exit 1
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          # ランキング学習（ltr。research/train_ltr.py）と直近5営業日の組のランキング学習（ltr5。research/train_ltr5.py）は
          # 追加モデルの探索・学習とは別のステップ。only から ltr・ltr5 を除いたものを追加モデルの対象（models）にし、ltr・ltr5 は
          # only が空かその名前を含むときだけ学習する。ranking=no（日曜 09:10 の回）ならどちらも学習しない（日曜 14:10 の回が作る）
          if [ "$RANKING" = "no" ] && [[ ",$ONLY," == *",ltr,"* || ",$ONLY," == *",ltr5,"* ]]; then
            echo "ranking=no なのに only にランキング学習（ltr・ltr5）がある: $ONLY"; exit 1
          fi
          MODELS=$(echo ",$ONLY," | sed 's/,ltr,/,/g; s/,ltr5,/,/g; s/,ltr,/,/g; s/^,//; s/,$//')
          echo "models=$MODELS" >> "$GITHUB_OUTPUT"
          for m in ltr ltr5; do
            if [ "$RANKING" != "no" ] && { [ -z "$ONLY" ] || [[ ",$ONLY," == *",$m,"* ]]; }; then v=yes; else v=no; fi
            echo "$m=$v" >> "$GITHUB_OUTPUT"
          done
          if [ -n "$ONLY" ]; then echo "対象を限定: $ONLY（基準モデルは触らない）"; else echo "全モデル"; fi
          if [ "$RANKING" = "no" ]; then echo "ランキング学習（ltr・ltr5）は外す（日曜 14:10 の回で作る）"; fi

      - name: Tune
        if: inputs.tune == 'yes' && steps.scope.outputs.only == ''
        run: |
          PRESETS=$(grep -v '^#' research/tune_presets.txt | tr '\n' ' ')
          # 分割は層別（year_cap_date）。前進分割（walkforward）は候補で、実験73 の結果を
          # 見て運用者が決める（docs/MODEL_ADOPTION_RULES.md §32）。変えるときは
          # tuning.PRODUCTION_CV と一緒に
          python3 research/run_tuning.py --n-trials 50 --cv year_cap_date \
            --features $PRESETS --n-splits 5 2>&1 | tail -30

      - name: Train production model
        if: steps.scope.outputs.only == ''
        run: python3 research/train_production.py 2>&1 | tee retrain.log

      # 画面に並べる追加モデル（xgb / cat。2026-10-09 に運用者の決定で logit / mlp を外し、同日夜に logit を戻したが、
      # 2026-10-29 の運用者の指示で 2026-11-02 の予測から再び外した）の探索。
      # 基準モデルと完全に同じ条件（本番と同じ分割 tuning.PRODUCTION_CV＝年×時価総額帯で
      # 層別・日付単位 / 5分割 / PR-AUC / 50試行 / 木200本固定 / ホールドアウトより手前だけ）。
      #
      # 毎週やり直す。営業日が積まれれば母集団が変わるため。判定は
      # multi_params.json の _cv.train_to（訓練データの最終日）が動いたか。
      #
      # Optuna の study 名には訓練最終日が入っているので、週が変われば
      # 自動的に新しい study になる。先週の試行（別のデータで測った値）が
      # 混ざって best_value を決めてしまうことはない。
      # DB（research/_data/optuna_multi.db）を data-raw Release 経由で
      # 持ち回すのは、同じ週にやり直したときの保険（下のタイムアウトや
      # コンテナ再起動で落ちた場合、完了済みの試行から再開できる）。
      - name: Tune extra models (opt-in)
        # only が ltr・ltr5 だけの回（ランキング学習だけ）は追加モデルを探索しない
        if: inputs.tune == 'yes' && (steps.scope.outputs.only == '' || steps.scope.outputs.models != '')
        # 実測: 2026-09-13 の週次実行で127分（試行記録から見積もった86分より
        # 4割長い。CI は手元より遅く、5モデルぶんの初回探索が丸ごと走った）。
        # 150分だと余裕が23分しかなく、データが増えれば足りなくなる。
        # 2026-09-20 は117分（151列）。206列では約2時間半の見込み。
        # 打ち切られても完了済みの試行は DB に残り、同じ週の再実行で続く
        # 2026-10-09 昼に xgb / cat の2つにしたが、同日夜に logit を戻して3つ
        # （10/04 は4モデルで 94分。logit が最長で 29〜74分）。210分なら余裕がある
        # 2026-10-18、210 -> 270分。列の組を360列（テクニカル指標111列を足した。§68）にしたので探索が延びる（実験105 の実測で
        # lgbm 1.3〜1.7倍）。直近の土曜の2回は 81分・136分（10/17）で、1.7倍なら約230分。ジョブの上限 330分の中に収める
        timeout-minutes: 270
        continue-on-error: true
        env:
          ONLY: ${{ steps.scope.outputs.models }}
        run: |
          # only があればそのモデルだけ（名前はカンマ区切り → 引数）。空なら 1.2σ の追加モデル（xgb / cat）。
          # ラベル違いのモデル（models.ACTIVE_VARIANTS。1.5σ の木3本）は既定に入れない。土曜に Routine が
          # only=lgbm_k15,xgb_k15,cat_k15（09:10 JST）で回す（実験78 の実測: 探索 1本 lgbm 13分・cat 12〜17分・
          # xgb 25〜35分。2026-10-11 夜）。1.8σ の4本（14:10 JST の回）は 2026-10-24 に運用者の依頼で、ロジスティック回帰
          # （logit・logit_k15）は運用者の指示（2026-10-29「次週からロジスティック回帰をなくしてください。…週次の更新自体
          # いらないです」）で 2026-11-02 の予測から外した（models.RETIRED / RETIRED_VARIANTS。名指ししても探索・学習しない）
          read -r -a ONLY_ARGS <<< "${ONLY//,/ }"
          python3 research/exp/e15_tune_all.py "${ONLY_ARGS[@]}" 2>&1 | tail -25

      # 追加モデル（models.EXTRA。only があればその名前。ラベル違いは only のときだけ）を学習して
      # research/model/models/<algo>/ に置く。
      # train_production.py（基準モデル）とは別のスクリプトなので、
      # ここが丸ごと失敗しても日次予測は動き続ける。
      - name: Train extra models
        # 4モデル × 10窓の out-of-fold ＋ 全期間モデル。実測143秒
        if: steps.scope.outputs.only == '' || steps.scope.outputs.models != ''
        timeout-minutes: 30
        continue-on-error: true
        env:
          ONLY: ${{ steps.scope.outputs.models }}
        run: |
          if [ -n "$ONLY" ]; then
            python3 research/train_multi.py --models "$ONLY" 2>&1 | tee -a retrain.log
          else
            python3 research/train_multi.py 2>&1 | tee -a retrain.log
          fi

      # ランキング学習の木の形の探索（research/tune_ltr.py。実験114 の L と同じ探索: run_tuning.py と同じ打ち切り・
      # 年×時価総額帯で層別した日付単位の5分割・種0・50試行・木200本固定・目的は検証分割の日付内 NDCG@5）。
      # 運用者の指示（2026-10-29）「日曜の再学習に毎週の探索を入れてください」。実験114c（docs/MODEL_ADOPTION_RULES.md §78-10）の
      # 実測で1回 14〜20分。最後まで終わったときだけ research/ltr_params.json を書き換え、下の Train ranking model がその木の形で
      # 学習する。落ちたり時間切れになったりしたら前の木の形のまま（continue-on-error）。ジョブの上限（330分）までの残りが、
      # この探索の上限（45分）と学習・上げ・コミットの分（あわせて45分）に足りなければ探索しない
      - name: Tune ranking model
        if: inputs.tune == 'yes' && steps.scope.outputs.ltr == 'yes'
        timeout-minutes: 45
        continue-on-error: true
        env:
          JOB_START: ${{ steps.start.outputs.t }}
        run: |
          left=$(( 330 * 60 - ($(date +%s) - JOB_START) ))
          if [ "$left" -lt $(( 90 * 60 )) ]; then
            echo "ジョブの上限まで残り $((left / 60))分。探索（上限45分）と学習・上げ・コミットに足りないので探索しない（前の木の形のまま）" | tee -a retrain.log
            exit 0
          fi
          python3 research/tune_ltr.py 2>&1 | tee -a retrain.log

      # ランキング学習（research/train_ltr.py。research/model/models/ltr/ に置く）。買いの規則には使わず、画面と実運用の追跡に
      # 「両方使う形」（今の規則 かつ その日の中でランキング学習が上半分）を参考に並べるためのもの（運用者の選択「まず並べて見る」
      # 2026-10-24。docs/MODEL_ADOPTION_RULES.md §78-9）。木の形は research/ltr_params.json（tune=yes の回は上の Tune ranking model が
      # その週のデータで探索し直したもの）。列の指紋が違えば学習しない（前回のモデルのまま）。失敗しても日次予測は動く（ランキング
      # 学習を出さないだけ）
      - name: Train ranking model
        if: steps.scope.outputs.ltr == 'yes'
        timeout-minutes: 30
        continue-on-error: true
        run: python3 research/train_ltr.py 2>&1 | tee -a retrain.log

      # 直近5営業日の組のランキング学習（research/ltr5.py。実験117 の W5）の木の形の探索（research/tune_ltr5.py。実験117 と同じ:
      # run_tuning.py と同じ打ち切り・判断日を暦月の塊にした5分割（前後4営業日を訓練から外す）・種0・50試行・木200本固定・目的は
      # 検証分割の組の中の NDCG@5）。運用者の選択「画面に並べて確かめる」（2026-10-30。docs/MODEL_ADOPTION_RULES.md §82-6）。
      # 実験117 の実測で 31.6分。最後まで終わったときだけ research/ltr5_params.json を書き換える（落ちたり時間切れになったりしたら
      # 前の木の形のまま。continue-on-error）。ジョブの上限（330分）までの残りが、この探索の上限（60分）と学習・上げ・コミットの分
      # （あわせて45分）に足りなければ探索しない
      - name: Tune 5-day ranking model
        if: inputs.tune == 'yes' && steps.scope.outputs.ltr5 == 'yes'
        timeout-minutes: 60
        continue-on-error: true
        env:
          JOB_START: ${{ steps.start.outputs.t }}
        run: |
          left=$(( 330 * 60 - ($(date +%s) - JOB_START) ))
          if [ "$left" -lt $(( 105 * 60 )) ]; then
            echo "ジョブの上限まで残り $((left / 60))分。探索（上限60分）と学習・上げ・コミットに足りないので探索しない（前の木の形のまま）" | tee -a retrain.log
            exit 0
          fi
          python3 research/tune_ltr5.py 2>&1 | tee -a retrain.log

      # 直近5営業日の組のランキング学習（research/train_ltr5.py。research/model/models/ltr5/ に置く）。買いの規則には使わず、
      # 予測タブとスプレッドシートに「直近5営業日の中の順位」と3条件・4条件の印を並べるためのもの（§82-6）。木の形は
      # research/ltr5_params.json。列の指紋が違えば学習しない（前回のモデルのまま）。失敗しても日次予測は動く（5日の順位を出さない
      # だけ）
      - name: Train 5-day ranking model
        if: steps.scope.outputs.ltr5 == 'yes'
        timeout-minutes: 30
        continue-on-error: true
        run: python3 research/train_ltr5.py 2>&1 | tee -a retrain.log

      # 1モデルの失敗で他を止めない作りにしたぶん、静かに欠けたまま
      # 運用が続くおそれがある。どれがいつ学習されたのかを毎週要約に出す
      - name: Model lineup
        if: always()
        continue-on-error: true
        run: |
          { echo '### 画面に並ぶモデル'
            python3 research/model_lineup.py --markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      # モデル本体は Release に置く。2.7MB のバイナリを毎週コミットすると
      # 差分圧縮が効かず、年138MB リポジトリが膨らむ。
      # meta.json（9KB）は git に残す。過去のモデルが「どういうものだったか」
      # （学習日・訓練期間・較正表・スコア帯の実績）は追えるようにしておく。
      - name: Upload model to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 基準モデルを作らない回（only）には model.txt が無い。あるときだけ上げる
          if [ -f research/model/model.txt ] && [ -f research/model/oof.parquet ]; then
            bash scripts/gh_release_upload.sh data-raw research/model/model.txt research/model/oof.parquet
          else
            echo "基準モデルは作っていないので上げない"
          fi
          # 5モデルぶん。ファイル名が algo ごとに衝突するので、
          # Release のアセット名に algo を入れて上げ直す
          shopt -s nullglob
          for d in research/model/models/*/; do
            a=$(basename "$d")
            for f in model.joblib oof.parquet; do
              [ -f "$d$f" ] || continue
              cp "$d$f" "/tmp/${a}_${f}"
              bash scripts/gh_release_upload.sh data-raw "/tmp/${a}_${f}"
            done
          done
          # Optuna の試行 DB も上げる。来週これを降ろして試行を引き継ぐ
          if [ -f research/_data/optuna_multi.db ]; then
            bash scripts/gh_release_upload.sh data-raw research/_data/optuna_multi.db
          fi

      - name: Commit model metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 毎週探索するぶん、選ばれたパラメータが週ごとに動く。何が動いたかを
          # 要約に残す。予測の変化の出どころを切り分ける手がかりになる
          { echo '### パラメータの変化（先週 -> 今週）'
            echo '```diff'
            git diff -- research/lgbm_params.json | tail -n +5 | head -60 || true
            echo '```'
            echo '### ランキング学習の木の形の変化（先週 -> 今週）'
            echo '```diff'
            git diff -- research/ltr_params.json | tail -n +5 | grep -E '^[-+] ' | head -30 || true
            echo '```'
            echo '### 直近5営業日の組のランキング学習の木の形の変化（先週 -> 今週）'
            echo '```diff'
            git diff -- research/ltr5_params.json | tail -n +5 | grep -E '^[-+] ' | head -30 || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 以前コミットしていたバイナリを追跡から外す（1回だけ効く）
          git rm --cached -q --ignore-unmatch research/model/model.txt \
            research/model/oof.parquet \
            'research/model/models/*/model.joblib' \
            'research/model/models/*/oof.parquet' 
          git add -A research/model/meta.json research/lgbm_params.json \
            research/multi_params.json research/ltr_params.json research/ltr5_params.json \
            research/model/models/*/meta.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(model): 週次の再学習 ($(date -u '+%Y-%m-%d'))"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          { echo '## 週次の再学習'; echo '```'
            if [ -f retrain.log ]; then tail -40 retrain.log; else echo "(実行せず)"; fi
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
