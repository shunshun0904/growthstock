name: Rebuild From Stored Data

# 保存済みの生データからデータセット・ラベル検証データ・ビューアを作り直す。
# 取得をやり直さずに後段だけを回せるので、ラベル定義を変えての再検証が即座にできる。
#
# 生データの取得元は2通り:
#   source=release  … GitHub Release (タグ data-raw)。既定。update-data.yml が作る
#   source=artifact … 指定した実行の artifact。Release ができる前の移行用
on:
  workflow_dispatch:
    inputs:
      source:
        description: '生データの取得元'
        type: choice
        options: [release, artifact]
        default: release
      run_id:
        description: 'source=artifact のとき、artifact を持つ実行のID'
        required: false
  push:
    branches: ['claude/breakout-model']
    paths: ['research/rebuild_run_id.txt']

permissions:
  contents: write
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      - name: Resolve run id
        id: rid
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(tr -d '[:space:]' < research/rebuild_run_id.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download raw data (release)
        if: inputs.source != 'artifact'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          gh release download data-raw --dir research/_data --clobber

      - name: Download raw data (artifact)
        if: inputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: research/_data
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: ls -lh research/_data

      - name: Compare label definitions
        run: python3 research/compare_label_defs.py 2>&1 | tee compare.log
      - name: Build dataset
        run: python3 research/build_dataset.py 2>&1 | tee build.log
      - name: Export label samples
        run: python3 research/export_label_samples.py 2>&1 | tee labels.log
      - name: Train and evaluate
        run: |
          python3 research/train_model.py             --val-start 2023-01-01 --test-start 2024-10-01 2>&1 | tee train.log

      - name: Build viewer
        run: |
          mkdir -p research/samples
          cp research/_data/label_samples.json research/samples/label_samples.json
          python3 research/viewer/build_viewer.py

      - run: |
          {
            echo "## データセット構築"; echo '```'; cat build.log; echo '```'
            echo "## ラベル検証データ"; echo '```'; cat labels.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/samples
          cp research/_data/label_comparison.json research/samples/label_comparison.json
          git add -A research/samples research/viewer docs/MODEL_RESULTS.md
          # git diff は未追跡ファイルを見ないため、staged の差分で判定する
          if git diff --cached --quiet; then
            echo "変更なし"; exit 0
          fi
          git commit -m "chore(research): ラベル検証データとビューアを更新"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: label-review
          path: |
            research/samples/label_samples.json
            research/viewer/label_review.html
            research/_data/label_comparison.json
            research/_data/results.json
            docs/MODEL_RESULTS.md
          retention-days: 30
