name: Accounting Graph GNN

# 会計フローグラフの Temporal GNN（GraphSAGE + GRU）を、ベースラインと
# 同じ分割・同じ行で比べる（research/accgraph/gnn.py）。
#
# ベースライン評価（accgraph.yml）とは分けてある。GNN を直すたびに
# 本体評価（約140分）まで走り直さないため。
#
# 所要時間の見込み（2026-09-23、4コアでの実測から）:
#   ベースライン6本 40〜60分 / GNN 3版 x 乱数3通り 60〜130分
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: '超過リターンの控除ベンチマーク'
        type: choice
        options: ['topix', 'sector']
        default: 'topix'
      horizon:
        description: '保有営業日数'
        type: choice
        options: ['5', '10', '20']
        default: '20'
      max_epochs:
        description: 'GNN の最大エポック数'
        type: string
        default: '25'
      cost_bps:
        description: '往復の取引コスト (bp)'
        type: string
        default: '30'
      commit:
        description: '結果を docs/ にコミットする'
        type: boolean
        default: true
  push:
    branches: ['claude/accounting-graph-gnn-prediction-27z98y']
    paths:
      - 'research/accgraph/gnn.py'
      - '.github/workflows/accgraph-gnn.yml'

permissions:
  contents: write

concurrency:
  group: accgraph-gnn
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gnn:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r research/requirements.txt

      # CPU 版。既定の PyPI 版は CUDA のライブラリを数GB引き込む
      - name: Install PyTorch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      # torch が入っているので、ここでは GNN のテストも回る
      - name: Unit tests
        run: python3 tests/test_accgraph.py

      - name: Download raw data (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p research/_data
          gh release download data-raw --dir research/_data --clobber
          ls -lh research/_data

      - name: Build dataset
        run: python3 research/accgraph/build.py 2>&1 | tee build.log

      # GNN と同じ分割・同じ行で、J-Quants のノードだけのベースラインを作る
      - name: Baselines (latest_jq / seq_jq)
        run: |
          python3 research/accgraph/gnn.py baselines \
            --benchmark "${{ inputs.benchmark || 'topix' }}" \
            --horizon "${{ inputs.horizon || '20' }}" \
            2>&1 | tee gnn_baselines.log

      - name: Train GNN (sage_gru / mlp_gru / sage_latest)
        run: |
          python3 research/accgraph/gnn.py train \
            --benchmark "${{ inputs.benchmark || 'topix' }}" \
            --horizon "${{ inputs.horizon || '20' }}" \
            --max-epochs "${{ inputs.max_epochs || '25' }}" \
            2>&1 | tee gnn_train.log

      - name: Compare
        run: |
          python3 research/accgraph/gnn.py report \
            --benchmark "${{ inputs.benchmark || 'topix' }}" \
            --horizon "${{ inputs.horizon || '20' }}" \
            --cost-bps "${{ inputs.cost_bps || '30' }}" \
            2>&1 | tee gnn_report.log

      - name: Summary
        if: always()
        run: |
          { echo '## Temporal GNN'
            if [ -f docs/ACCGRAPH_GNN.md ]; then
              cat docs/ACCGRAPH_GNN.md
            else
              echo "(比較まで届かず)"
              echo '```'
              for f in gnn_train.log gnn_baselines.log; do
                [ -f "$f" ] && tail -40 "$f"
              done
              echo '```'
            fi; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accgraph-gnn
          path: |
            docs/ACCGRAPH_GNN.md
            research/_data/accgraph/gnn/*.json
            build.log
            gnn_baselines.log
            gnn_train.log
            gnn_report.log
          retention-days: 30
          if-no-files-found: warn

      # push で起動したときは inputs が空になる。手動実行のときだけ
      # チェックボックスを見る（accgraph.yml と同じ理由）
      - name: Commit results
        if: github.event_name != 'workflow_dispatch' || inputs.commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/ACCGRAPH_GNN.md
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(accgraph): GNN の比較を更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i)); git pull --rebase
          done
          exit 1
