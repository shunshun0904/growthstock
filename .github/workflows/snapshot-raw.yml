name: Snapshot Raw Data

# 取り直す前の生データを、別のタグの Release に写しておく。
#
# 取り込みの誤り（2026-09-24 の重複除去など）を直して種別を取り直すと、
# data-raw の中身は上書きされ、直す前のデータは残らない。直す前と後で
# 学習の結果を比べる実験（Run Experiment の snapshot 入力）のために、
# 取り直す前にここで写す。data-raw には触らない（読むだけ）。
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: '写す種別（スペース区切り。例: fins lvshld）'
        required: true
      tag:
        description: '写し先のタグ（英小文字・数字・ハイフン。例: pre-dedupe-20260924）'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt

      # 入力をそのままシェルに展開しない（run-experiment.yml と同じ）
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KINDS_IN: ${{ inputs.kinds }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[a-z0-9][a-z0-9-]{2,60}$ ]] || [ "$TAG" = "data-raw" ]; then
            echo "タグ名が不正: $TAG"; exit 1
          fi
          KNOWN=$(python3 -c "import sys;sys.path.insert(0,'research');sys.path.insert(0,'scripts');import data_store as D;print(' '.join(D.ROW_KEYS))")
          mkdir -p snap
          for k in $KINDS_IN; do
            case " $KNOWN " in
              *" $k "*) ;;
              *) echo "未知の種別: $k（扱えるのは $KNOWN）"; exit 1 ;;
            esac
            gh release download data-raw --dir snap --pattern "${k}_*.parquet" --clobber
          done
          ls -lh snap
          n=$(ls snap | wc -l)
          [ "$n" -gt 0 ] || { echo "写すファイルが無い"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "生データの写し: $TAG" \
              --notes "取り直す前の data-raw の写し（種別: $KINDS_IN）。比べる実験のためだけに置く。" \
              --latest=false
          gh release upload "$TAG" snap/* --clobber
          {
            echo "## 写した生データ（$TAG）"
            echo '```'
            ls -lh snap
            python3 - <<'EOF'
          import glob, pandas as pd
          for p in sorted(glob.glob("snap/*.parquet")):
              print(f"{p.split('/')[-1]:<32}{len(pd.read_parquet(p)):>10,}行")
          EOF
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
