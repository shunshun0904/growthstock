name: Update Volume Profiles

# 「価格帯別出来高」タブの集計（research/build_volume_profile.py。経緯と計算は docs/VOLUME_PROFILE.md）。
#
# 直近5営業日の予測対象すべてについて、予測の基準日までの 1・5・20営業日の価格帯別出来高を、
# 蓄積した分足・ティック（下書きの Release data-minute・data-tick-YYYY）と日足（Release data-raw。照合用）から作る。
# 結果は Release data-volume-profile に volume-profile.json として上げる（2026-11-21 からデプロイは画面に載せない。
# 2026-11-28 から Release は下書き（非公開）。docs/OPERATIONS.md「data-raw を非公開にする」）。
#
# 2026-11-19〜11-20 は**集計を誰でも見られる形で公開していた**（公開の Release とサイト。2026-11-21 にやめた。下の on:）。
# 運用者の選択（2026-11-19「暗号化をやめて公開する」）。それまでは
# J-Quants の API キーから作った鍵で暗号化して載せていた（#11）。J-Quants の公式ヘルプでは、個人の利用はデータの第三者
# への配信が禁止とされていることを伝えたうえでの選択（docs/VOLUME_PROFILE.md「公開について」）。
# J-Quants の API キー（Secret JQUANTS_API）は、取引カレンダーを取るためにこのワークフローの中だけで使う。
#
# 2026-11-20 までは、予測（Predict Breakouts）・分足（Update Minute Bars）・ティック（Update Ticks）のそれぞれが終わるたびに
# 作り直していた（workflow_run）。2026-11-21 に運用者の依頼「分足のデータは使わない方針になったので価格帯別出来高の分布タグも
# 消してください。データ取得と保存は契約が切れるまで引き続きお願いします（分足のデータの保存はそのままにしておいてください）」
# → 選択「隠して集計も止める」「公開をやめる」で、タブを隠し、自動の起動を外し、デプロイに載せる段（deploy-pages.yml）を外し、
# Release data-volume-profile の集計ファイルを消すことにした（実際には消えておらず、2026-11-28 に Release ごと下書き（非公開）に
# した）。分足・ティックの取得と保存（Update Minute Bars・Update Ticks）は続ける。
# 手で起動すると、集計は下書き（非公開）の Release に上がる（公開になっていたら上げずに止まる。GH_ENSURE_DRAFT）。
# 集計を作り直すかは、起動する前に運用者に確かめる。
# docs/VOLUME_PROFILE.md「止めたこと（2026-11-21）」。
on:
  workflow_dispatch:

# 下書きの Release（分足・ティック）を読み、data-volume-profile に上げる（git にはコミットしない）
permissions:
  contents: write

concurrency:
  group: update-volume-profile
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OUT_TAG: data-volume-profile
  OUT_FILE: volume-profile.json
  #: 暗号化していたころのアセット（2026-11-19 の #11）。上げるときに消す
  OLD_FILE: volume-profile.enc.json

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 予測は実行の途中で predictions.json をコミットするので、起動元のコミットではなく公開ブランチの先頭を取る
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 版は research/requirements.txt に合わせる
      - run: pip install pandas==2.2.3 pyarrow==18.1.0 numpy==2.1.3
      # 画面と同じ確かめ（scripts/check_volume_profile.mjs）に使う
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ティックの日ごとのファイル（1日 約27MB）は読み終えたら消す（20日ぶんで 約540MB）
      - name: Build
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          mkdir -p "$RUNNER_TEMP/vp/out"
          python3 -u research/build_volume_profile.py \
            --work-dir "$RUNNER_TEMP/vp/work" \
            --download-cmd "bash scripts/gh_release_download.sh" \
            --output "$RUNNER_TEMP/vp/out/$OUT_FILE" \
            --summary-json "$RUNNER_TEMP/vp/summary.json" \
            --remove-after-read 2>&1 | tee vp.log
          exit "${PIPESTATUS[0]}"

      # 画面が読める集計か（src/lib/volumeProfile.js の確かめ）を、上げる前に見る。通らなければ上げない
      - name: Check with the screen's rules
        run: node scripts/check_volume_profile.mjs "$RUNNER_TEMP/vp/out/$OUT_FILE"

      - name: Upload
        env:
          TITLE: 価格帯別出来高
          NOTES: 「価格帯別出来高」タブの集計（volume-profile.json。直近5営業日の予測対象すべての 1・5・20営業日）。growthstock の Update Volume Profiles が書き、Deploy to GitHub Pages が画面に載せる（docs/VOLUME_PROFILE.md）。
        run: |
          # 分足から作った集計も J-Quants のデータ。下書き（非公開）で作り、公開になっていたら止める（exit 3）。「見つからない」ときだけ作る（2026-11-28。docs/OPERATIONS.md「data-raw を非公開にする」）
          GH_ENSURE_DRAFT=1 bash scripts/gh_release_ensure.sh "$OUT_TAG" "$TITLE" "$NOTES"
          bash scripts/gh_release_upload.sh "$OUT_TAG" "$RUNNER_TEMP/vp/out/$OUT_FILE"
          echo "上げた: $OUT_TAG / $OUT_FILE"
          # 暗号化していたころの題名・説明とアセットを片づける（無ければ何もしない）
          gh release edit "$OUT_TAG" --title "$TITLE" --notes "$NOTES" >/dev/null || echo "（題名・説明は直せなかった）"
          if gh release view "$OUT_TAG" --json assets --jq '.assets[].name' | grep -qx "$OLD_FILE"; then
            gh release delete-asset "$OUT_TAG" "$OLD_FILE" --yes && echo "消した: $OUT_TAG / $OLD_FILE"
          fi

      # ログと実行の画面は公開。件数・日付・ファイル名だけを出す（価格・数量の値は出さない）
      - name: Summary
        if: always()
        run: |
          {
            echo "## 価格帯別出来高（Release \`$OUT_TAG\`）"
            if [ -f "$RUNNER_TEMP/vp/summary.json" ]; then
              python3 - "$RUNNER_TEMP/vp/summary.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          w = r.get("window") or {}
          rows = [
              ("基準日", r.get("asOf")),
              ("対象", f"{r.get('targets')}銘柄（予測日 {', '.join(r.get('targetDates') or [])}）"),
              ("集計に使う営業日", f"{w.get('from')} 〜 {w.get('to')}（{w.get('sessions')}日）" if w else "-"),
          ]
          for source, label in (("tick", "ティック"), ("minute", "分足")):
              st = (r.get("stored") or {}).get(source)
              if st:
                  rows.append((f"{label}: 置き場", f"{st['days']}日 / 無い日 {st['missing'] or 'なし'} / "
                                                 f"ファイル {(r.get('files') or {}).get(source)}"))
                  rows.append((f"{label}: 日足との照合（銘柄×日）", (r.get("reconcile") or {}).get(source)))
          for n, by in (r.get("status") or {}).items():
              rows.append((f"{n}営業日の集計", " / ".join(f"{s}: {c}" for s, c in by.items())))
          b = r.get("bytes") or {}
          rows.append(("大きさ", f"{b:,} バイト" if isinstance(b, int) else "-"))
          rows.append(("時間", f"{r.get('seconds')}秒（取り出したファイル {r.get('fetchedFiles')}件）"))
          print("| 項目 | 値 |\n|---|---|")
          for k, v in rows:
              print(f"| {k} | {v} |")
          for m in r.get("warnings") or []:
              print(f"- 注意: {m}")
          EOF
            fi
            echo ""
            echo '```'
            tail -40 vp.log 2>/dev/null || echo '(出力なし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
