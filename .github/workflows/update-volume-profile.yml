name: Update Volume Profiles

# 「価格帯別出来高」タブの集計（research/build_volume_profile.py。経緯と計算は docs/VOLUME_PROFILE.md）。
#
# 直近5営業日の予測対象すべてについて、予測の基準日までの 1・5・20営業日の価格帯別出来高を、
# 蓄積した分足・ティック（下書きの Release data-minute・data-tick-YYYY）と日足（Release data-raw。照合用）から作る。
# 結果は J-Quants の API キー（Secret JQUANTS_API）から作った鍵で暗号化し、Release data-volume-profile に
# volume-profile.enc.json として上げる。Deploy to GitHub Pages がそれを dist/data/ に置き、画面で J-Quants の
# キーを入れた人のブラウザの中だけで開く（キーはどこにも送らない）。新しい鍵や Secret は要らない。
#
# data-volume-profile は公開の Release（デプロイの読み取り専用の鍵で読めるように）。中身は暗号文だけで、
# 上げる前に research/volume_profile_crypto.py check で暗号文の形であることを確かめる。
#
# 予測（Predict Breakouts）・分足（Update Minute Bars）・ティック（Update Ticks）のそれぞれが終わるたびに作り直す。
# どれも毎晩の取り込み（Update Data Store）の後に並んで走り、終わる順は日によって違うので、最後に終わったものの
# 後の集計が全部そろったものになる。そろう前の集計では、まだ置き場に無い日の種別が「欠損」と出る。
on:
  workflow_run:
    workflows: ['Predict Breakouts', 'Update Minute Bars', 'Update Ticks']
    types: [completed]
  workflow_dispatch:

# 下書きの Release（分足・ティック）を読み、data-volume-profile に上げる（git にはコミットしない）
permissions:
  contents: write

concurrency:
  group: update-volume-profile
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OUT_TAG: data-volume-profile
  OUT_FILE: volume-profile.enc.json

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 予測は実行の途中で predictions.json をコミットするので、起動元のコミットではなく公開ブランチの先頭を取る
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 版は research/requirements.txt に合わせる
      - run: pip install pandas==2.2.3 pyarrow==18.1.0 numpy==2.1.3 cryptography==50.0.2
      # 画面と同じ確かめ（scripts/check_volume_profile.mjs）に使う
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ティックの日ごとのファイル（1日 約27MB）は読み終えたら消す（20日ぶんで 約540MB）
      - name: Build and encrypt
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          mkdir -p "$RUNNER_TEMP/vp/out"
          python3 -u research/build_volume_profile.py \
            --work-dir "$RUNNER_TEMP/vp/work" \
            --download-cmd "bash scripts/gh_release_download.sh" \
            --encrypt-to "$RUNNER_TEMP/vp/out/$OUT_FILE" \
            --output "$RUNNER_TEMP/vp/plain.json" \
            --summary-json "$RUNNER_TEMP/vp/summary.json" \
            --remove-after-read 2>&1 | tee vp.log
          exit "${PIPESTATUS[0]}"

      # 画面でキーを入れたときに読める集計か（src/lib/volumeProfile.js の確かめ）を、上げる前に見る。
      # 平文はこのランナーの中だけに置き、確かめたら消す（上げない）
      - name: Check with the screen's rules
        run: |
          trap 'rm -f "$RUNNER_TEMP/vp/plain.json"' EXIT
          node scripts/check_volume_profile.mjs "$RUNNER_TEMP/vp/plain.json"

      # 平文を誤って上げないよう、暗号文の形（見出しの項目・方式・長さ）を確かめてから上げる
      - name: Upload
        run: |
          f="$RUNNER_TEMP/vp/out/$OUT_FILE"
          python3 research/volume_profile_crypto.py check "$f"
          bash scripts/gh_release_ensure.sh "$OUT_TAG" "価格帯別出来高（暗号化済み）" \
            "「価格帯別出来高」タブの集計（volume-profile.enc.json）。J-Quants の API キーから作った鍵で暗号化してあり、画面でキーを入れた人だけが開ける。growthstock の Update Volume Profiles が書き、Deploy to GitHub Pages が画面に載せる（docs/VOLUME_PROFILE.md）。"
          bash scripts/gh_release_upload.sh "$OUT_TAG" "$f"
          echo "上げた: $OUT_TAG / $OUT_FILE"

      # ログと実行の画面は公開。件数・日付・ファイル名だけを出す（価格・数量の値は出さない）
      - name: Summary
        if: always()
        run: |
          {
            echo "## 価格帯別出来高（Release \`$OUT_TAG\`。暗号化済み）"
            if [ -f "$RUNNER_TEMP/vp/summary.json" ]; then
              python3 - "$RUNNER_TEMP/vp/summary.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          w = r.get("window") or {}
          rows = [
              ("基準日", r.get("asOf")),
              ("対象", f"{r.get('targets')}銘柄（予測日 {', '.join(r.get('targetDates') or [])}）"),
              ("集計に使う営業日", f"{w.get('from')} 〜 {w.get('to')}（{w.get('sessions')}日）" if w else "-"),
          ]
          for source, label in (("tick", "ティック"), ("minute", "分足")):
              st = (r.get("stored") or {}).get(source)
              if st:
                  rows.append((f"{label}: 置き場", f"{st['days']}日 / 無い日 {st['missing'] or 'なし'} / "
                                                 f"ファイル {(r.get('files') or {}).get(source)}"))
                  rows.append((f"{label}: 日足との照合（銘柄×日）", (r.get("reconcile") or {}).get(source)))
          for n, by in (r.get("status") or {}).items():
              rows.append((f"{n}営業日の集計", " / ".join(f"{s}: {c}" for s, c in by.items())))
          b = r.get("bytes") or {}
          rows.append(("大きさ", f"平文 {b.get('plain', 0):,} / 暗号文 {b.get('encrypted', 0):,} バイト"))
          rows.append(("時間", f"{r.get('seconds')}秒（取り出したファイル {r.get('fetchedFiles')}件）"))
          print("| 項目 | 値 |\n|---|---|")
          for k, v in rows:
              print(f"| {k} | {v} |")
          for m in r.get("warnings") or []:
              print(f"- 注意: {m}")
          EOF
            fi
            echo ""
            echo '```'
            tail -40 vp.log 2>/dev/null || echo '(出力なし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
