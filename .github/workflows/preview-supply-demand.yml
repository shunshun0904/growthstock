name: Preview Price Band Demand

# 表示用データだけを検証する手動プレビュー。公開ブランチ・Release・Pagesへは書かない。
# 既存のJ-Quants SecretをActions内だけで使い、約定金額・公表日も確認する。
on:
  workflow_dispatch:
  # 開発ブランチでは、この検証ワークフロー自体を変更したときだけ実接続を確認。
  # 公開ブランチでのpush・通常の日次更新では自動実行しない。
  push:
    branches: ['codex/price-band-demand-*']
    paths: ['.github/workflows/preview-supply-demand.yml']

permissions:
  # data-raw は下書き（非公開）の Release にする。下書きは書き込み権限のある鍵にしか見えず、読むだけの鍵では
  # 「無い」と同じに見えるので write（2026-11-27。docs/OPERATIONS.md「data-raw を非公開にする」）
  contents: write

jobs:
  preview:
    if: ${{ !startsWith(github.ref, 'refs/heads/codex/price-band-demand-coverage-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Download cached daily bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/_data
          python3 - <<'PY' > /tmp/demand-years.txt
          import json
          data = json.load(open('public/data/stocks.json'))
          years = {int(s['asOf'][:4]) for s in data['stocks']}
          print('\n'.join(str(y) for y in sorted(years | {y - 1 for y in years})))
          PY
          while read -r year; do
            gh release download data-raw --pattern "bars_${year}.parquet" --dir research/_data
          done < /tmp/demand-years.txt
      - name: Verify calculations
        run: python3 -m unittest discover -s tests -p 'test_supply_demand.py'
      - name: Refresh display context only
        env:
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: |
          mkdir -p preview
          python3 scripts/backfill_supply_demand.py --stocks public/data/stocks.json \
            --bars-dir research/_data --refresh-margin --output preview/stocks.json \
            | tee preview/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: price-band-demand-data
          path: preview/
          retention-days: 7

  catalog:
    if: startsWith(github.ref, 'refs/heads/codex/price-band-demand-coverage-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 pyarrow==18.1.0
      - name: Verify catalog and existing calculations
        run: python3 -m unittest discover -s tests -p 'test_supply_demand*.py'
      - name: Build all-code display data without changing production
        env:
          GH_TOKEN: ${{ github.token }}
          JQUANTS_API: ${{ secrets.JQUANTS_API }}
        run: bash scripts/build_supply_demand_assets.sh preview/supply-demand
      - name: Check stocks outside the daily detailed snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('preview/supply-demand')
          index = json.loads((root / 'index.json').read_text())
          for code in ['28940', '64670']:
              data = json.loads((root / f'{code}.json').read_text())
              assert index['stocks'][code]['status'] == 'ok'
              assert data['supplyDemand']['long']['averagePrice'] > 0
          print('Known saved stocks have published demand data')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: price-band-demand-catalog
          path: preview/
          retention-days: 7
